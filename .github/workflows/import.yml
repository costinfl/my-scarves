name: Import clubs

# Four jobs that hand data to each other through one branch (import/run-<id>), so each job's
# results are pushed as soon as it ends and a slow or failed later job never loses earlier work.
# Like a Maven multi-module build: each job is a module with its own timeout, run in order.
#   import    clubs and stadiums from Wikidata (about a minute)
#   enrich    logos, UEFA ids, colours, palettes, Wikipedia home kits, blurbs, addresses, cross-border homes
#   fanshops  visits each club's website; the slowest stage, so it gets its own time budget and
#             commits whatever it finished even if it runs out of time (the rest is retried next run)
#   pr        coverage report and the pull request, even if enrich or fanshops failed

on:
  workflow_dispatch:
    inputs:
      associations:
        description: 'UEFA association codes, space-separated (e.g. ROU ENG ESP)'
        required: true
      refresh:
        description: 'Ignore the Wikidata cache'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: import
  cancel-in-progress: false

env:
  CODES: ${{ inputs.associations }}
  REFRESH: ${{ inputs.refresh && '--refresh' || '' }}
  BRANCH: import/run-${{ github.run_id }}

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate input
        run: |
          if ! [[ "$CODES" =~ ^[A-Za-z]{3}( +[A-Za-z]{3})*$ ]]; then
            echo "::error::associations must be 3-letter codes separated by spaces"; exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run import -- $CODES $REFRESH
      - name: Push to the import branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add -A data
          git diff --cached --quiet || git commit -m "Import $CODES from Wikidata"
          git push origin "HEAD:$BRANCH"

  enrich:
    needs: import
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BRANCH }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run enrich -- $CODES --stage logos,uefa,colors,palettes,kits,blurbs,addresses,homes $REFRESH
      - name: Push enrichment
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if [ -d assets/logos ]; then git add -A assets/logos; fi
          git diff --cached --quiet || git commit -m "Enrich $CODES"
          git push origin "HEAD:$BRANCH"

  fanshops:
    needs: enrich
    if: ${{ !cancelled() && needs.enrich.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BRANCH }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Discover fan shops
        # The stage saves every 20 clubs, so a timeout keeps what was found; unvisited clubs are retried next run.
        timeout-minutes: 120
        continue-on-error: true
        run: npm run enrich -- $CODES --stage fanshops $REFRESH
      - name: Push fan shops
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet || git commit -m "Fan shops for $CODES"
          git push origin "HEAD:$BRANCH"

  pr:
    needs: [import, enrich, fanshops]
    if: ${{ always() && needs.import.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BRANCH }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run coverage
      # A PR opened with the workflow's own token does not trigger CI, so check here that the
      # site still builds with the new data before proposing it.
      - run: npm run typecheck && npm test && npm run build
      - name: Open a pull request with the data diff
        env:
          GH_TOKEN: ${{ github.token }}
          ENRICH: ${{ needs.enrich.result }}
          FANSHOPS: ${{ needs.fanshops.result }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet || git commit -m "Coverage report for $CODES"
          git push origin "HEAD:$BRANCH"
          git fetch --depth=1 origin main
          if git diff --quiet origin/main -- data/ assets/; then
            echo "No data changes."; exit 0
          fi
          {
            echo "Automated import for: $CODES"
            echo
            echo "Jobs: import success, enrich $ENRICH, fan shops $FANSHOPS."
            echo "Review the data diff before merging."
            echo
            cat data/generated/coverage.md
          } > "$RUNNER_TEMP/body.md"
          gh pr create --title "Import $CODES" --body-file "$RUNNER_TEMP/body.md" --base main --head "$BRANCH"
